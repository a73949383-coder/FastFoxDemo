
name: Build FastFox Demo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FastFoxDemoAndroid_project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q FastFoxDemoAndroid_project.zip

      - name: Build APK
        run: gradle -p FastFoxDemoAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FastFoxDemo-APK
          path: FastFoxDemoAndroid/app/build/outputs/apk/debug/app-debug.apk
          
